<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { FontLoader }    from 'three/addons/loaders/FontLoader.js';
import { TextGeometry }  from 'three/addons/geometries/TextGeometry.js';

// ── Renderer ──────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ── Scene ─────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color('#080E20');

// ── Camera ────────────────────────────────────────────────
const frustumSize = 11;
let aspect = window.innerWidth / window.innerHeight;
const camera = new THREE.OrthographicCamera(
  -frustumSize * aspect / 2,  frustumSize * aspect / 2,
   frustumSize / 2,           -frustumSize / 2,
  0.1, 200
);
camera.position.set(9, 7, 9);
camera.lookAt(0, 2, 0);

// ── Controls ──────────────────────────────────────────────
const controls = new OrbitControls(camera, renderer.domElement);
controls.enablePan = false;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.3;
controls.target.set(0, 2, 0);
controls.minPolarAngle = Math.PI / 8;
controls.maxPolarAngle = Math.PI / 2.4;
controls.update();

// ── Toon gradient ─────────────────────────────────────────
const fmt = renderer.capabilities.isWebGL2 ? THREE.RedFormat : THREE.LuminanceFormat;
const gradientMap = new THREE.DataTexture(new Uint8Array([0, 100, 220]), 3, 1, fmt);
gradientMap.minFilter = gradientMap.magFilter = THREE.NearestFilter;
gradientMap.needsUpdate = true;

const matCache = {};
function mat(hex) {
  if (!matCache[hex]) matCache[hex] = new THREE.MeshToonMaterial({ color: new THREE.Color(hex), gradientMap });
  return matCache[hex];
}

function box(w, h, d, hex, x, y, z, ry = 0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(hex));
  m.position.set(x, y, z);
  m.rotation.y = ry;
  m.castShadow = m.receiveShadow = true;
  scene.add(m);
  return m;
}

function cyl(rt, rb, h, seg, hex, x, y, z) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat(hex));
  m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true;
  scene.add(m);
  return m;
}

function sph(r, hex, x, y, z, sx = 1, sy = 1, sz = 1) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 9), mat(hex));
  m.position.set(x, y, z);
  m.scale.set(sx, sy, sz);
  m.castShadow = true;
  scene.add(m);
  return m;
}

//  LIGHTING
// ════════════════════════════════════════════════════════
// 夜空だけど色が死なない程度に明るく
scene.add(new THREE.AmbientLight('#6080B0', 1.6));

// 月光（キャラに色が乗る程度）
const moonDir = new THREE.DirectionalLight('#C8D8FF', 1.4);
moonDir.position.set(-5, 10, -6);
moonDir.castShadow = true;
moonDir.shadow.mapSize.set(1024, 1024);
Object.assign(moonDir.shadow.camera, { near: 1, far: 40, left: -8, right: 8, top: 8, bottom: -8 });
scene.add(moonDir);

// キャラ周辺を柔らかく照らすフィルライト
const fillLight = new THREE.PointLight('#FFE8C0', 1.2, 12);
fillLight.position.set(0, 3, 2);
scene.add(fillLight);

// ════════════════════════════════════════════════════════
//  GROUND ISLAND
// ════════════════════════════════════════════════════════
cyl(4.8, 4.4, 1.0, 22, '#3D2210', 0, -0.5, 0);   // soil
cyl(4.8, 4.8, 0.28, 22, '#2E6228', 0, 0.14, 0);  // grass top
cyl(4.82, 4.6, 0.12, 22, '#3A7A34', 0, 0.26, 0); // grass highlight rim

// Grass edge tufts
for (let i = 0; i < 20; i++) {
  const a = (i / 20) * Math.PI * 2;
  const r = 4.0 + Math.random() * 0.55;
  sph(0.2, '#377030', Math.cos(a)*r, 0.18, Math.sin(a)*r, 1.3, 0.55, 1.0);
}

// ════════════════════════════════════════════════════════
//  STARS
// ════════════════════════════════════════════════════════
const starVerts = [];
for (let i = 0; i < 500; i++) {
  const theta = Math.random() * Math.PI * 2;
  const phi   = Math.random() * Math.PI * 0.5 + 0.05;
  const r     = 35 + Math.random() * 10;
  starVerts.push(
    r * Math.sin(phi) * Math.cos(theta),
    r * Math.cos(phi),
    r * Math.sin(phi) * Math.sin(theta)
  );
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starVerts, 3));
const starMat = new THREE.PointsMaterial({ color: '#FFFFFF', size: 0.22, sizeAttenuation: true });
scene.add(new THREE.Points(starGeo, starMat));

// Bright accent stars
const brightStars = [];
for (let i = 0; i < 20; i++) {
  const theta = Math.random() * Math.PI * 2;
  const phi   = Math.random() * Math.PI * 0.42 + 0.05;
  const r = 30;
  const s = new THREE.Mesh(
    new THREE.SphereGeometry(0.12, 6, 4),
    new THREE.MeshBasicMaterial({ color: '#EEEEFF' })
  );
  s.position.set(
    r * Math.sin(phi) * Math.cos(theta),
    r * Math.cos(phi),
    r * Math.sin(phi) * Math.sin(theta)
  );
  s.userData.phase = Math.random() * Math.PI * 2;
  scene.add(s);
  brightStars.push(s);
}

//  MOON
// ════════════════════════════════════════════════════════
const MOON = new THREE.Vector3(-0.5, 6.5, -5.5);

function moonTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = 256;
  const ctx = canvas.getContext('2d');
  const cx = 128, cy = 128, r = 56;

  const glow = ctx.createRadialGradient(cx - 8, cy, r * 0.45, cx - 8, cy, r * 1.65);
  glow.addColorStop(0.0, 'rgba(255, 213, 74, 0.32)');
  glow.addColorStop(0.45, 'rgba(255, 178, 45, 0.14)');
  glow.addColorStop(1.0, 'rgba(255, 178, 45, 0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, 256, 256);

  const body = ctx.createRadialGradient(cx - 20, cy - 18, 4, cx - 8, cy, r);
  body.addColorStop(0, '#FFF0A0');
  body.addColorStop(0.58, '#FFD84A');
  body.addColorStop(1, '#F4A72C');
  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();

  ctx.globalCompositeOperation = 'destination-out';
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(cx + 28, cy - 1, r * 0.98, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  ctx.strokeStyle = 'rgba(255, 245, 166, 0.42)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(cx - 2, cy, r - 1, Math.PI * 0.64, Math.PI * 1.36);
  ctx.stroke();

  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const moonMesh = new THREE.Sprite(
  new THREE.SpriteMaterial({ map: moonTexture(), transparent: true, depthWrite: false })
);
moonMesh.position.copy(MOON);
moonMesh.scale.set(2.6, 2.6, 1);
scene.add(moonMesh);

// Moon point light (illuminates scene softly)
const moonPt = new THREE.PointLight('#FFD24A', 0.38, 22);
moonPt.position.copy(MOON);
scene.add(moonPt);

// ════════════════════════════════════════════════════════
//  CLOUDS (dark silhouette)
// ════════════════════════════════════════════════════════
function cloud(x, y, z, s = 1) {
  const cm = new THREE.MeshBasicMaterial({ color: '#131E38', transparent: true, opacity: 0.75 });
  [[0,0,0,1.1], [-0.85,0.1,0,0.85], [0.85,0.05,0,0.82], [-0.45,-0.15,0,0.65], [0.5,-0.1,0,0.7]].forEach(([cx,cy,cz,r]) => {
    const m = new THREE.Mesh(new THREE.SphereGeometry(r*s, 10, 7), cm);
    m.scale.y = 0.55;
    m.position.set(x+cx*s, y+cy*s, z+cz*s);
    scene.add(m);
  });
}
cloud(-11, 9.5, -9);
cloud(9,  10.5, -13, 0.85);
cloud(-5,  8.5,  10, 0.7);

function roundTree(x, z, s = 1) {
  cyl(0.12*s, 0.18*s, 1.0*s, 8, '#4A2E18', x, 0.5*s, z);
  sph(0.9*s, '#1E5A24', x, 1.6*s, z);
  sph(0.65*s, '#256030', x + 0.38*s, 1.72*s, z + 0.22*s);
  sph(0.58*s, '#1A5020', x - 0.28*s, 1.65*s, z - 0.28*s);
  sph(0.48*s, '#226828', x + 0.12*s, 2.05*s, z - 0.18*s);
}

function pineTree(x, z, s = 1) {
  cyl(0.1*s, 0.15*s, 0.85*s, 7, '#4A2E18', x, 0.42*s, z);
  cyl(0, 1.05*s, 0.9*s,  9, '#183C1A', x, 0.85 + 0.45*s, z);
  cyl(0, 0.80*s, 0.80*s, 9, '#1A4420', x, 0.85 + 0.88*s, z);
  cyl(0, 0.55*s, 0.65*s, 9, '#1E4A22', x, 0.85 + 1.25*s, z);
  cyl(0, 0.32*s, 0.5*s,  9, '#205026', x, 0.85 + 1.57*s, z);
}

function labelTexture(text, fill, stroke = 'rgba(255,255,255,0.9)', fontSize = 72, width = 192, height = 112) {
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, width, height);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `900 ${fontSize}px Arial Rounded MT Bold, Arial, sans-serif`;
  ctx.lineJoin = 'round';
  ctx.lineWidth = 16;
  ctx.strokeStyle = stroke;
  ctx.strokeText(text, width / 2, height / 2);
  ctx.fillStyle = fill;
  ctx.fillText(text, width / 2, height / 2);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function spriteLabel(text, fill, width, height, fontSize) {
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: labelTexture(text, fill, 'rgba(240, 255, 238, 0.85)', fontSize),
    transparent: true,
    depthWrite: false,
  }));
  sprite.scale.set(width, height, 1);
  return sprite;
}

function addPaw(armMesh, bodyMat, dir) {
  // dir: -1=left, +1=right  (arm local space: outward = dir*x)
  const pawMat = bodyMat;
  const palm = new THREE.Mesh(new THREE.SphereGeometry(0.14, 8, 6), pawMat);

  palm.scale.set(1.05, 0.78, 1.0);
  armMesh.add(palm);
  // 3 finger nubs in a small arc
  [-0.07, 0, 0.07].forEach((oz, i) => {
    const nub = new THREE.Mesh(new THREE.SphereGeometry(0.056, 6, 4), pawMat);
    nub.position.set(dir * 0.28, 0.06, 0.12 + oz);
    armMesh.add(nub);
  });
}

function sawMesh(geo, material, x, y, z, sx = 1, sy = 1, sz = 1) {

function shootingStar() {
  const group = new THREE.Group();
  const ssColors = ['#FFFFFF','#F6F2FF','#ECE8FF','#D8D4F0','#B8B4D8'];
  for (let i = 0; i < 6; i++) {
    const s = new THREE.Mesh(
      new THREE.SphereGeometry(0.105 - i*0.014, 6, 4),
      new THREE.MeshBasicMaterial({ color: ssColors[i], transparent: true, opacity: 1 - i*0.14 })
    );
    s.position.x = i * 0.48;
    group.add(s);
  }
  group.rotation.z = 0.46;
  group.visible = false;
  scene.add(group);
  return group;
}

const shootingStars = Array.from({ length: 6 }, (_, i) => {
  const s = shootingStar();
  s.userData = {
    delay: i / 6,
    speed: 0.16 + i * 0.012,
    startX: -12 + (i % 3) * 4.8,
    startY: 13.5 + (i % 2) * 1.1,
    startZ: -11 + i * 2.7,
  };
  return s;
});

[[-3.45, 0.85], [3.25, 0.95], [-2.9, -1.85], [2.85, -1.9], [-0.75, -3.45]].forEach(([fx, fz], i) => {
  cyl(0.02, 0.02, 0.22, 5, '#5A8840', fx, 0.22, fz);
  sph(0.1, flowerColors[i % 3], fx, 0.35, fz);
});

// ════════════════════════════════════════════════════════
//  CHARACTERS ON SEESAW
//  円軌道で走らせず、板の左右端に固定する。
//  plank.localToWorld() で板の傾き込みの座標を取る。
// ════════════════════════════════════════════════════════
const SEE_SEAT_LOCAL = new THREE.Vector3(-1.16, 0.16, 0);
const SAW_SEAT_LOCAL = new THREE.Vector3( 1.16, 0.16, 0);
const seeSeatWorld = new THREE.Vector3();
const sawSeatWorld = new THREE.Vector3();
const CHAR_SCALE = 0.66;

const NIGHT_ORBIT_RADIUS = 2.35;
const NIGHT_ORBIT_BASE_Y = 0.28;
const NIGHT_ORBIT_START = 1.28;
function nightOrbitProgress(u) {
  if (u < 0.78) {
    const k = u / 0.78;
    return k * k * (3 - 2 * k); // smoothstep
  }
  return 1.0; // stop and watch for a moment
}

// ════════════════════════════════════════════════════════
//  ANIMATE
// ════════════════════════════════════════════════════════
let t = 0;
renderer.setAnimationLoop(() => {
  t += 0.016;
  controls.update();

  // Flame flicker
  flame1.scale.y = 0.85 + Math.sin(t*7.8)*0.22;
  flame1.scale.x = 0.90 + Math.cos(t*6.9)*0.16;
  flame2.scale.y = 0.80 + Math.sin(t*9.8+1)*0.28;
  flame3.scale.y = 0.80 + Math.sin(t*8.0+2)*0.26;
  flame4.scale.y = 0.75 + Math.sin(t*11.0+3)*0.35;
  firePt.intensity    = 4.5 + Math.sin(t*4.8)*1.2;
  firePtLow.intensity = 1.6 + Math.sin(t*3.2+1)*0.5;

  // Embers float up & fade
  embers.forEach(em => {
    const { bx, bz, phase, speed } = em.userData;
    const cycle = ((t * speed + phase) % 3.0) / 3.0; // 0→1 per cycle
    em.position.x = bx + Math.sin(t * 1.8 + phase) * 0.10;
    em.position.y = 0.55 + cycle * 1.8;
    em.position.z = bz + Math.cos(t * 1.4 + phase) * 0.10;
    em.material.opacity = Math.sin(cycle * Math.PI) * 0.95;
    em.material.transparent = true;
    em.scale.setScalar(1.0 - cycle * 0.6);
  });

  // Swing (ブランコ) pendulum
  swingPivot.rotation.x = Math.sin(t * 1.35) * 0.48;

  // Lamp flicker (very subtle)
  lampPt.intensity = 2.4 + Math.sin(t*0.9)*0.14;

  // Firefly drift
  fireflies.forEach(ff => {
    const { ox, oy, oz, phase, speed } = ff.userData;
    ff.position.x = ox + Math.sin(t*speed + phase)*0.7;
    ff.position.y = oy + Math.sin(t*speed*1.4 + phase+1)*0.35;
    ff.position.z = oz + Math.cos(t*speed*0.8 + phase)*0.6;
  });

  // Star twinkle
  brightStars.forEach(s => {
    const sc = 0.7 + Math.abs(Math.sin(t*1.5 + s.userData.phase))*0.6;
    s.scale.setScalar(sc);
  });

  // ── Seesaw rock ──────────────────────────────────────────
  const seesawAngle = Math.sin(t * 2.1) * 0.30; // 初期設定に戻す
  plank.rotation.z = seesawAngle;
  seesaw.updateMatrixWorld(true);

  // ── Characters fixed on the seesaw ends ─────────────────
  const playStep = t * 6.4; // キャラのリアクションも2倍速

  plank.localToWorld(seeSeatWorld.copy(SEE_SEAT_LOCAL));
  plank.localToWorld(sawSeatWorld.copy(SAW_SEAT_LOCAL));

  const seeUp = Math.max(0, -seesawAngle);
  const sawUp = Math.max(0,  seesawAngle);
  const seeDown = Math.max(0,  seesawAngle);
  const sawDown = Math.max(0, -seesawAngle);

  // キャラ同士が向かい合うように、板の左右端を結ぶ方向へ向ける
  const faceAngle = Math.atan2(
    sawSeatWorld.x - seeSeatWorld.x,
    sawSeatWorld.z - seeSeatWorld.z
  );

  // SEE: 左端に固定。SAW側を向く
  seeFriend.position.set(seeSeatWorld.x, seeSeatWorld.y + seeUp * 0.10, seeSeatWorld.z);
  seeFriend.rotation.y = faceAngle;
  seeFriend.rotation.z = seesawAngle * 0.55 + Math.sin(playStep) * 0.025;
  seeFriend.scale.set(CHAR_SCALE * (1 + seeDown * 0.12), CHAR_SCALE * (1 - seeDown * 0.10), CHAR_SCALE);
  seeLeftArm.rotation.z  =  0.35 + Math.sin(playStep) * 0.18 + seeUp * 0.35;
  seeRightArm.rotation.z = -0.35 - Math.sin(playStep) * 0.18 - seeUp * 0.35;
  foreheadCurl.rotation.z = Math.sin(t * 8.4 + 0.4) * 0.07;
  seeHelmet.rotation.z    = Math.sin(t * 9.2 + 0.2) * 0.035;

  // SAW: 右端に固定。SEE側を向く
  sawFriend.position.set(sawSeatWorld.x, sawSeatWorld.y + sawUp * 0.10, sawSeatWorld.z);
  sawFriend.rotation.y = faceAngle + Math.PI;
  sawFriend.rotation.z = seesawAngle * 0.55 + Math.sin(playStep + Math.PI) * 0.025;
  sawFriend.scale.set(CHAR_SCALE * (1 + sawDown * 0.12), CHAR_SCALE * (1 - sawDown * 0.10), CHAR_SCALE);
  sawLeftArm.rotation.z  =  0.27 + Math.sin(playStep + Math.PI) * 0.16 + sawUp * 0.30;
  sawRightArm.rotation.z = -0.27 - Math.sin(playStep + Math.PI) * 0.16 - sawUp * 0.30;
  sawHelmet.rotation.z   = Math.sin(t * 6.4 + 1.8) * 0.03;

  // ── Labels & notes ───────────────────────────────────────
  seeLabel.position.y = 1.32 + Math.sin(t * 3.1) * 0.018;
  sawLabel.position.y = 1.32 + Math.sin(t * 2.5 + 1.8) * 0.016;
  musicGroup.children.forEach((note, i) => {
    note.position.y = note.userData.baseY + Math.sin(t * 3.5 + i) * 0.012;
    note.rotation.z = Math.sin(t * 4.2 + i) * 0.12;
  });


  // ── Night orbit: ぽよぽよ歩き + stop-and-watch ───────────
  const nightCycle = (t * 0.036) % 1; // かなりゆっくり一周
  const nightProgress = nightOrbitProgress(nightCycle);
  const nightAngle = NIGHT_ORBIT_START + nightProgress * Math.PI * 2;
  const nightMoving = nightCycle < 0.78 ? 1.0 : 0.16;
  const nightWalkPhase = t * 4.2;
  const nightBounce = Math.sin(nightWalkPhase) * nightMoving;
  const nightBob = Math.abs(Math.sin(nightWalkPhase)) * 0.04 * nightMoving + Math.sin(t * 1.6) * 0.008;
  const nightX = seesaw.position.x + Math.cos(nightAngle) * NIGHT_ORBIT_RADIUS;
  const nightZ = seesaw.position.z + Math.sin(nightAngle) * NIGHT_ORBIT_RADIUS;
  // 円の中心ではなく、円の進行方向へ向ける
  const nightMoveDir = Math.atan2(-Math.sin(nightAngle), Math.cos(nightAngle));

  nightFriend.position.set(nightX, NIGHT_ORBIT_BASE_Y + nightBob, nightZ);
  nightFriend.rotation.y = nightMoveDir + Math.sin(t * 1.2) * 0.035;
  nightFriend.rotation.z = Math.sin(t * 2.4) * 0.012 + nightBounce * 0.012;
  nightFriend.scale.set(0.68 - Math.abs(nightBounce) * 0.012, 0.68 + Math.abs(nightBounce) * 0.018, 0.68);

  nightLeftArm.rotation.z = 0.16 + nightBounce * 0.09;
  nightRightArm.rotation.z = -0.16 - nightBounce * 0.09;
  nightLeftFoot.position.y = 0.07 + Math.max(0,  Math.sin(nightWalkPhase)) * 0.03 * nightMoving;
  nightRightFoot.position.y = 0.08 + Math.max(0, -Math.sin(nightWalkPhase)) * 0.03 * nightMoving;
  nightLeftFoot.rotation.x =  nightBounce * 0.055;
  nightRightFoot.rotation.x = -nightBounce * 0.055;
  nightCurl.rotation.z = Math.sin(t * 2.5 + 0.8) * 0.05;
  nightHelmet.rotation.z = Math.sin(t * 2.9 + 0.2) * 0.02 + nightBounce * 0.01;
  moonSprite.rotation.z = Math.sin(t * 1.3) * 0.15;

  // Shooting stars
  shootingStars.forEach((star) => {
    const { delay, speed, startX, startY, startZ } = star.userData;
    const cycle = (t * speed + delay) % 1;
    if (cycle < 0.22) {
      const p = cycle / 0.22;
      star.visible = true;
      star.position.set(startX + p*16, startY - p*6.4, startZ + p*5.5);
      star.scale.setScalar(0.75 + Math.sin(p * Math.PI) * 0.55);
      star.children.forEach((part, i) => {
        part.material.opacity = (1 - i * 0.14) * Math.sin(p * Math.PI);
      });
    } else {
      star.visible = false;
    }
  });

  renderer.render(scene, camera);
});

// ── Resize ────────────────────────────────────────────────
window.addEventListener('resize', () => {
  aspect = window.innerWidth / window.innerHeight;
  camera.left   = -frustumSize * aspect / 2;
  camera.right  =  frustumSize * aspect / 2;
  camera.top    =  frustumSize / 2;
  camera.bottom = -frustumSize / 2;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
